    # 插值模式
    I:lerpMode=0

    # 行间距
    D:lineSpacing=0.1

    # 渲染 Z 偏移
    D:renderOffset=0.0

    # 是否替换原版字体渲染
    B:replaceOrigin=false

    # 阴影 X 偏移
    D:shadowOffsetX=0.5

    # 阴影 Y 偏移
    D:shadowOffsetY=0.5

    # 平滑上界
    D:smoothRangeMax=0.9

    # 平滑下界
    D:smoothRangeMin=0.0

    # 空格宽度
    D:spaceWidth=4.0
}


general {
    # 是否启用字体运行时高频诊断日志；默认关闭，避免淹没其他 debug 输出 [default: false]
    B:fontRuntimeDebug=false

    # 网络传输适配器：vanilla 为默认 early mixin 路径，forge 仅用于兼容排障。 [default: vanilla]
    S:netTransport=vanilla

    # 是否在屏幕右上角显示当前页面类名 [default: false]
    B:uiDebug=false

    # 是否启用调试输出 [default: false]
    B:useDebug=false
}


