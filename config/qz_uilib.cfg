# Configuration file

fontsizesetting {
    # 字符生成分辨率
    D:awtCharSize=64.0

    # 默认显示字号
    D:charSize=9.0

    # 字体缩放系数
    D:fontScale=0.9
}


fontsystem {
    # AA 模式
    I:aaMode=2

    # AA 强度
    D:aaStrength=12.0

    # HSV 亮度增强，仅增强亮度并保持原有颜色倾向
    D:brightnessGain=10.0

    # 字符字体覆盖规则，格式为 字符或范围=字体名；禁用规则使用 disabled: 前缀
    S:characterFontRules <
     >

    # 字间距
    D:characterSpacing=0.1

    # 是否接管物品数量字体
    B:customInvCountFont=false

    # drawString 阶段每次最多补充上传字符数
    I:drawStageUploadBatchSize=2

    # drawString 阶段补充上传的最短间隔（毫秒）
    D:drawStageUploadIntervalMs=20.0

    # drawString 阶段每秒最多补充上传次数
    I:drawStageUploadLimitPerSecond=20

