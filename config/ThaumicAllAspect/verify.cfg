# ============================================================
# ThaumicAllAspect - Aspect Verification Config
# ThaumicAllAspect - 要素验证配置文件
# ============================================================
#
# This file lets you verify whether specific items received
# the correct aspects after the full scan completes.
# Results are written to: logs/ThaumicAllAspect-scan.log
#
# 此文件用于验证指定物品在完整扫描后是否获得了正确的要素。
# 结果输出到: logs/ThaumicAllAspect-scan.log
#
# ============================================================
# FORMAT / 格式
# ============================================================
#
#   modid:itemName:meta=Display Name
#
#   modid      - The mod's ID (e.g. minecraft, Thaumcraft, IC2)
#                模组ID（如 minecraft、Thaumcraft、IC2）
#   itemName   - The item's registry name (NOT the display name)
#                物品的注册名（不是显示名）
#   meta       - The metadata/damage value (usually 0)
#                元数据/损伤值（通常为 0）
#   Display Name - Any label you want (just for readability)
#                  任意标签（仅用于可读性）
#
# TIP: You can find registry names in the cache file:
#   logs/ThaumicAllAspect-cache.cfg
# Each line looks like: Thaumcraft:ItemResource@6 = vinculum=2, vitreus=2
# The part before @ is modid:itemName, the part after @ is meta.
#
# 提示：你可以在缓存文件中找到注册名：
#   logs/ThaumicAllAspect-cache.cfg
# 每行格式如: Thaumcraft:ItemResource@6 = vinculum=2, vitreus=2
# @ 前面是 模组id:物品名，@ 后面是 meta 值。
#
# Lines starting with # are comments (ignored).
# 以 # 开头的行为注释（会被忽略）。
# Remove the # at the beginning of a line to enable it.
# 删除行首的 # 即可启用该条目。
#
# ============================================================
# EXAMPLES / 示例
# ============================================================
#
# --- Vanilla Minecraft / 原版 ---
# minecraft:diamond:0=Diamond
# minecraft:iron_ingot:0=Iron Ingot
# minecraft:gold_ingot:0=Gold Ingot
# minecraft:cobblestone:0=Cobblestone
#
# --- Thaumcraft / 神秘时代 ---
# Thaumcraft:ItemResource:6=Amber
# Thaumcraft:blockCosmeticOpaque:0=Amber Block
# Thaumcraft:blockCosmeticOpaque:1=Amber Brick
# Thaumcraft:ItemShard:0=Air Shard
#
# --- GregTech ---
# gregtech:gt.metaitem.01:11300=Bronze Ingot
#
# --- IC2 ---
# IC2:itemIngot:0=Copper Ingot
#
# --- Tinkers' Construct / 匠魂 ---
# TConstruct:materials:0=Paper
#
