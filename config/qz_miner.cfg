# Configuration file

client {
    # 是否启用客户端连锁预览计算与渲染；关闭后将不再执行任何预览相关渲染操作 [default: true]
    B:clientEnablePreviewRender=true

    # 客户端预览透明度的结束值；距离超过衰减终点时使用该透明度
    D:clientPreviewAlphaEndValue=0.15

    # 客户端预览透明度衰减到最低值的距离半径；超过该半径后保持最低透明度
    D:clientPreviewAlphaFadeEndRadius=6.0

    # 客户端预览透明度开始衰减的距离半径；在此半径内保持最高透明度
    D:clientPreviewAlphaFadeStartRadius=2.0

    # 客户端预览透明度的起始值；距离不超过衰减起点时使用该透明度
    D:clientPreviewAlphaStartValue=0.78

    # 客户端最大预览半径；实际预览范围取该值与 chainRadius 的较小值，避免大范围预览渲染导致卡顿 [range: 1 ~ 2147483647, default: 4]
    I:clientPreviewMaxRadius=4

    # 客户端最大预览目标数量；实际预览数量取该值与服务端 chainMaxBlocks 的较小值，避免大范围预览导致卡顿 [range: 1 ~ 2147483647, default: 256]
    I:clientPreviewMaxTargets=256

    # 客户端并行 Tick 任务单个分片的工作预算单位；越大预览推进越快但单片耗时可能更高，默认 640 [range: 1 ~ 2147483647, default: 640]
    I:parallelTickClientWorkBudgetUnits=640
}


general {
    # CHAIN 伐木子模式每次向外扩展的壳层数；1 表示围绕当前原木检查一圈 3x3x3 邻域 [range: 1 ~ 2147483647, default: 1]
    I:chainLoggingShellLayers=1

    # 最大连锁数量 [range: 1 ~ 2147483647, default: 256]
    I:chainMaxBlocks=256

    # 连锁范围半径（方盒子半径，搜索顺序仍为中心扩散） [range: 1 ~ 2147483647, default: 4]
    I:chainRadius=4

    # 是否允许非自然生成的 GT/BW 矿石也享受时运；关闭时保持原版仅自然矿可时运 [default: false]
    B:enableFortuneForPlacedOre=false

    # 是否解除 GT/BW/GT++ 普通矿的 3 级时运上限；关闭时保持原版逻辑 [default: false]
    B:enableUnlimitedOreFortune=false

    # How shall I greet? [default: Hello World]
    S:greeting=Hello World

    # 每 Tick 最多执行的连锁挖掘数量 [range: 1 ~ 2147483647, default: 16]
    I:maxBreakPerTick=16

    # 同步执行器每刻最短执行时间（毫秒），默认 15，最低 10 [range: 10 ~ 2147483647, default: 15]
    I:parallelTickMinDurationMs=15

    # 服务端并行 Tick 任务单个分片的工作预算单位；越大推进越快但单片耗时可能更高，默认 64 [range: 1 ~ 2147483647, default: 64]
    I:parallelTickServerWorkBudgetUnits=64
}


