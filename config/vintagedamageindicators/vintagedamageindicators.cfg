# Configuration file

damage-particles {
    # Whether particles should always be visible, ignoring obstructing blocks. [default: false]
    B:alwaysRender=false

    # Strength at which particles bounce at spawn. [range: 0.0 ~ 3.4028235E38, default: 1.5]
    S:bounceStrength=1.5

    # Color of critical particles, in hex format. (e.g. 8C1E02) [default: 8c1e02]
    S:criticalParticleColor=8c1e02

    # Speed at which critical particles fall. [range: 1.4E-45 ~ 3.4028235E38, default: -0.05]
    S:criticalParticleGravity=-0.05

    # Critical particle lifespan. [range: 0 ~ 2147483647, default: 12]
    I:criticalParticleLifespan=12

    # The scale of critical particles. [range: 0.01 ~ 10.0, default: 3.0]
    S:criticalParticleScale=3.0

    # Critical particle transparency. [range: 0.0 ~ 1.0, default: 0.9947]
    S:criticalParticleTransparency=0.9947

    # Whether critical particles are enabled. [default: true]
    B:criticalParticlesEnabled=false

    # Speed at which damage particles fall. [range: 1.4E-45 ~ 3.4028235E38, default: 0.8]
    S:damageParticleGravity=0.8

    # Damage particle lifespan. [range: 0 ~ 2147483647, default: 12]
    I:damageParticleLifespan=12

    # Whether the numbers that appear as pop-up particles are outlined in a darker color. [default: true]
    B:damageParticleOutline=true

    # The scale of damage particles. [range: 0.01 ~ 10.0, default: 3.0]
    S:damageParticleScale=3.0

    # Damage particle transparency. [range: 0.0 ~ 1.0, default: 0.9947]
    S:damageParticleTransparency=0.9947

    # Whether the pop-up particles when a mob is injured or healed are enabled. [default: true]
    B:damageParticlesEnabled=false

    # Whether particles vanilla critical particles are disabled. [default: false]
    B:disableVanillaCriticalParticles=false

    # Whether particles drop shadows. [default: true]
    B:dropShadow=true

    # Color of heal particles, in hex format. (e.g. 00FF00) [default: ff00]
    S:healColor=ff00

    # Color of hurt particles, in hex format. (e.g. FFAA00) [default: ffaa00]
    S:hurtColor=ffaa00
}


debug {
    # Enable debug logging [default: false]
    B:debugMode=false

    # If set to true, print a list of mob names on game post init. [default: false]
    B:printMobs=false
}


hud-indicator {
    # Whether health appears with a more visible yellow/black scheme. [default: false]
    B:colorblindHealthBar=false

    # Whether to disable the boss bar. [default: false]
    B:disableBossBar=false

    # Whether health appears with a decimal point. [default: true]
    B:healthDecimals=true

    # Whether health appears appears as a | (true) or / (false). [default: true]
    B:healthSeparator=true

    # Whether to hide the HUD when the debug screen is enabled. [default: false]
    B:hideOnDebug=false

    # The global pitch angle used for entity previews. [range: -90.0 ~ 90.0, default: -12.0]
    S:hudEntityPitch=-12.0

    # The size in pixels a usual entity should render as in the HUD indicator. [range: 0.0 ~ 2000.0, default: 38.0]
    S:hudEntitySize=38.0

    # The global yaw angle used for entity previews. [range: -180.0 ~ 180.0, default: 35.0]
    S:hudEntityYaw=35.0

    # Whether the health of the entity in the hud indicator should be outlined. [default: false]
    B:hudHealthTextOutline=false

    # True if the hud indicator appears on the left side of the screen, false for right. [default: true]
    B:hudIndicatorAlignLeft=true

    # True if the hud indicator appears on the top of the screen, false for bottom. [default: true]
    B:hudIndicatorAlignTop=true

    # How opaque the background of the hud indicator is. [range: 0.0 ~ 10.0, default: 0.75]
    S:hudIndicatorBackgroundOpacity=0.75

    # Whether the hud damage indicator is enabled. [default: true]
    B:hudIndicatorEnabled=true

    # How many pixels from the left side of the screen the hud indicator is. [range: -2147483648 ~ 2147483647, default: 10]
    I:hudIndicatorPositionX=10

    # How many pixels from the top of the screen the hud indicator is. [range: -2147483648 ~ 2147483647, default: 10]
    I:hudIndicatorPositionY=10

    # The relative size of hud indicator. [range: 0.0 ~ 10.0, default: 0.75]
    S:hudIndicatorSize=0.6

    # How long after mousing over an entity the hud damage indicator remains on screen, in game ticks. [range: 0 ~ 1200, default: 30]
    I:hudLingerTime=30

    # Whether the name of the entity in the hud indicator should be outlined. [default: false]
    B:hudNameTextOutline=false

    # Whether the remaining potion duration is shown next to each potion icon. [default: true]
    B:hudPotionEffectTime=true

    # Whether active potion effects are shown below the health bar. [default: true]
    B:hudPotionEffectsEnabled=true

    # Whether damage popoffs are shown inside the HUD entity preview. [default: true]
    B:hudPreviewParticlesEnabled=true

    # How far away (in blocks) entities can be to appear in the hud health indicator [range: 3.0 ~ 10000.0, default: 100.0]
    S:maxDistance=100.0

    # List of entity class names to render with the model-only HUD fallback if the normal entity render behaves badly. [default: ]
    S:oldRenderEntities <
     >
}


potion-sync {
    # Whether server-side VDI sends potion durations to non-op players. [default: true]
    B:serverSendPotionDurationsToNonOps=true

    # Whether server-side VDI sends potion durations to op players. [default: true]
    B:serverSendPotionDurationsToOps=true

    # Whether server-side VDI sends potion icons to non-op players. [default: true]
    B:serverSendPotionTypesToNonOps=true

    # Whether server-side VDI sends potion icons to op players. [default: true]
    B:serverSendPotionTypesToOps=true
}


type-overrides {
    # Entity override rules are stored as JSON in vintagedamageindicators/overrides.json.
    S:overridesFile=overrides.json
}


