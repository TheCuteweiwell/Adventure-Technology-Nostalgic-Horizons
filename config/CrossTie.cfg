# Configuration file

fps {
    # Temporarily disable Angelica optimizations and fallback when render anomalies are detected. [default: true]
    B:enableAngelicaFallbackGuard=true

    # Use Angelica fast-path state cache and direct-buffer staging for corrected render data. [default: true]
    B:enableAngelicaFastPath=true

    # Consume ATSAssist IFTTT post-update snapshots as render-only immutable cache. [default: true]
    B:enableAngelicaIfTTTCache=true

    # Enable render culling for RTM entities and tiles. [default: true]
    B:enableRenderCulling=true

    # Expand rail bounding boxes to mitigate Angelica/Sodium rail culling issues. [default: false]
    B:fixAngelicaRailCulling=false
}


tps {
    # Enable tile entity update optimization. [default: true]
    B:enableTileEntityUpdates=true
}


